<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>BMI Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<div class="box">
    <h1>BMI Calculator</h1>

    <label for="height">Height (<i><b>1 to 2.5 meters</b></i>)</label>
    <input type="number" id="height" min="1" max="2.50" step="0.01">
    <br>

    <label for="weight">Weight (<i><b>1 to 200 kilos</b></i>)</label>
    <input type="number" id="weight" min="1" max="200">
    <br>

    <button onclick="calculateBMI()" id="calculate">Calculate</button>
</div>

<div class="result">
    <svg width="300" height="180" viewBox="0 0 300 180">

        <path d="M 20 160 A 130 130 0 0 1 90 60"
            stroke="#2196f3" stroke-width="20" fill="none"/>

        <path d="M 90 60 A 130 130 0 0 1 150 40"
            stroke="#4caf50" stroke-width="20" fill="none"/>

        <path d="M 150 40 A 130 130 0 0 1 210 60"
            stroke="#ffeb3b" stroke-width="20" fill="none"/>

        <path d="M 210 60 A 130 130 0 0 1 280 160"
            stroke="#f44336" stroke-width="20" fill="none"/>

    <line id="needle"
        x1="150" y1="160"
        x2="150" y2="60"
        stroke="black"
        stroke-width="4"/>

    <circle cx="150" cy="160" r="6" fill="black"/>
    </svg>


</div>


<script src="script.js"></script>
</body>

</html>
