<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>BMI Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<div class="input_box">
    <h1>BMI Calculator</h1>

    <label for="height">Height (<i><b>in meters</b></i>)</label>
    <input type="number" id="height" min="1" max="2.50" step="0.01">
    <br>

    <label for="weight">Weight (<i><b>in kilos</b></i>)</label>
    <input type="number" id="weight" min="1" max="200">
    <br>

    <button onclick="calculateBMI()" id="calculate">Calculate</button>
</div>

<div class="result_box">
    <h1>Result: </h1>
    <p id="result"></p>

    <div class="bar">
        <div class="fill" id="fill"></div>
    </div>
</div>


<script src="script.js"></script>
</body>

</html>
